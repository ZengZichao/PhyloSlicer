# Matches the gates CI runs, so a commit cannot land that CI will reject:
# the same directories, the same two checks.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check src tests benchmarks examples testing_suite validation
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format --check
        entry: ruff format --check src tests benchmarks examples testing_suite validation
        language: system
        types: [python]
        pass_filenames: false
